<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordem de Serviço</title>

<link rel="stylesheet" href="/static/style.css">

<style>
.secao {
    background: #1e3a8a;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 12px;
}

.botoes {
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.btn-principal {
    background:#16a34a;
    color:white;
    padding:10px;
    border:none;
    border-radius:8px;
}

.btn-secundario {
    background:#2563eb;
    color:white;
    padding:10px;
    border-radius:8px;
    text-decoration:none;
}
</style>
</head>

<body>

{% include "_header.html" %}

<form method="POST" action="/os">

<input type="hidden" name="pecas_json" id="pecas_json">
<input type="hidden" name="servicos_json" id="servicos_json">
<input type="hidden" name="id" value="{{ id }}">

<div class="secao">
    <h3>Dados do Cliente</h3>

    <div class="campo">
        <label>Nome do Cliente:</label>
        <input type="text" name="cliente" value="{{ ordem[1] if ordem else '' }}">
    </div>

    <div class="item-campo">
        <label>Telefone:</label>
        <input type="text" name="telefone" value="{{ ordem[2] if ordem else '' }}">
    </div>

    <div class="campo">
        <label>Veículo:</label>
        <input type="text" name="veiculo" value="{{ ordem[3] if ordem else '' }}">
    </div>

    <div class="campo">
        <label>Placa:</label>
        <input type="text" name="placa" value="{{ ordem[4] if ordem else '' }}">
    </div>

    <div class="campo">
        <label>Quilometragem:</label>
        <input type="number" name="quilometragem" required
            value="{{ ordem[13] if ordem else '' }}">
    </div>
</div>

<div class="secao">
    <h3>Datas e Responsável</h3>

    <div class="campo">
        <label>Data de Entrada:</label>
        <input type="date" name="data_entrada" value="{{ ordem[11] if ordem else '' }}">
    </div>

    <div class="campo">
        <label>Data de Saída:</label>
        <input type="date" name="data_saida" value="{{ ordem[12] if ordem else '' }}">
    </div>

    <div class="campo">
        <label>Mecânico:</label>
        <select name="mecanico">
            <option value="">Selecione</option>
            {% for m in mecanicos %}
                <option value="{{ m[1] }}" {% if ordem and ordem[10] == m[1] %}selected{% endif %}>
                    {{ m[1] }}
                </option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="secao">
    <h3>Diagnóstico</h3>

    <div class="campo">
        <label>Problema:</label>
        <textarea name="problema">{{ ordem[5] if ordem else '' }}</textarea>
    </div>

    <div class="campo">
        <label>Solução:</label>
        <textarea name="diagnostico">{{ ordem[6] if ordem else '' }}</textarea>
    </div>
</div>

<h3>🔧 Peças</h3>
<div id="tabela_pecas"></div>

<div class="secao">
    <input type="text" id="peca_nome" placeholder="Descrição">
    <input type="number" id="peca_qtd" value="1">
    <input type="number" id="peca_valor" step="0.01" placeholder="Valor">

    <button type="button" onclick="adicionarPeca()" class="btn-principal">
        + Adicionar Peça
    </button>
</div>

<h3>🛠 Serviços</h3>
<div id="tabela_servicos"></div>

<div class="secao">
    <input type="text" id="servico_nome" placeholder="Descrição">
    <input type="number" id="servico_qtd" value="1">
    <input type="number" id="servico_valor" step="0.01" placeholder="Valor">

    <label>
        <input type="checkbox" id="servico_comissao">
        Comissão
    </label>

    <button type="button" onclick="adicionarServico()" class="btn-principal">
        + Adicionar Serviço
    </button>
</div>

<h3>TOTAL: R$ <span id="total_geral">0.00</span></h3>

<div class="secao">
    <div class="campo">
        <label>Status:</label>
        <select name="status">
            <option value="EM ANDAMENTO" {% if ordem and ordem[9]=='EM ANDAMENTO' %}selected{% endif %}>EM ANDAMENTO</option>
            <option value="AGUARDANDO PEÇAS" {% if ordem and ordem[9]=='AGUARDANDO PEÇAS' %}selected{% endif %}>AGUARDANDO PEÇAS</option>
            <option value="PENDENTE" {% if ordem and ordem[9]=='PENDENTE' %}selected{% endif %}>PENDENTE</option>
            <option value="FINALIZADA" {% if ordem and ordem[9]=='FINALIZADA' %}selected{% endif %}>FINALIZADA</option>
        </select>
    </div>
</div>

<div class="botoes">
    <button type="submit" class="btn-principal">
        💾 Salvar OS
    </button>

    {% if id and id != 0 %}
    <a href="/gerar_nota/{{ id }}" target="_blank" class="btn-secundario">
        📄 Gerar / Abrir Nota
    </a>

    <a href="/cancelar_os/{{ id }}" 
       onclick="return confirm('Deseja realmente cancelar esta OS?')"
       style="background:#dc2626; color:white; padding:10px; border-radius:8px; text-decoration:none;">
        ❌ Cancelar OS
    </a>
    {% endif %}
</div>

</form>

<script>

let pecas = [];

function adicionarPeca() {
    let nome = document.getElementById("peca_nome")?.value;
    let qtd = parseFloat(document.getElementById("peca_qtd")?.value || 1);
    let valor = parseFloat(document.getElementById("peca_valor")?.value || 0);

    console.log("DEBUG:", nome, qtd, valor);

    if (!nome) {
        alert("Digite a descrição da peça");
        return;
    }

    pecas.push({ nome, qtd, valor });

    document.getElementById("peca_nome").value = "";
    document.getElementById("peca_qtd").value = 1;
    document.getElementById("peca_valor").value = "";
    document.getElementById("peca_nome").focus();

    console.log(pecas);
    renderPecas();
}

function renderPecas() {
    let html = `
    <table class="tabela-pecas">
        <thead>
            <tr>
                <th>Descrição</th>
                <th>Qtd</th>
                <th>Valor</th>
                <th>Total</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
    `;

    let total = 0;

    pecas.forEach((p, i) => {
        let t = p.qtd * p.valor;
        total += t;

        html += `
            <tr style="text-align:center; border-bottom:1px solid #ddd;">
                <td style="padding:8px;">${p.nome}</td>
                <td>${p.qtd}</td>
                <td>R$ ${p.valor.toFixed(2)}</td>
                <td>R$ ${t.toFixed(2)}</td>
                <td>
                    <button type="button" class="btn-acao" onclick="editarPeca(${i})">✏️</button>

                    <button type="button" class="btn-acao btn-remove" onclick="removerPeca(${i})">🗑️</button>
                </td>
            </tr>
        `;
    });

    html += `
            </tbody>
        </table>
    `;

    document.getElementById("tabela_pecas").innerHTML = html;
    document.getElementById("total_geral").innerText = total.toFixed(2);
    document.getElementById("pecas_json").value = JSON.stringify(pecas);
    calcularTotalGeral();
}

function removerPeca(index){
    pecas.splice(index, 1);
    renderPecas();
}

function editarPeca(index){
    let p = pecas[index];

    document.getElementById("peca_nome").value = p.nome;
    document.getElementById("peca_qtd").value = p.qtd;
    document.getElementById("peca_valor").value = p.valor;

    pecas.splice(index, 1);

    renderPecas();
}

let servicos = [];

function adicionarServico(){
    let nome = document.getElementById("servico_nome").value;
    let qtd = parseFloat(document.getElementById("servico_qtd").value || 1);
    let valor = parseFloat(document.getElementById("servico_valor").value || 0);
    let comissao = document.getElementById("servico_comissao").checked;

    if(!nome){
        alert("Digite o serviço");
        return;
    }

    servicos.push({nome, qtd, valor, comissao});

    document.getElementById("servico_nome").value = "";
    document.getElementById("servico_qtd").value = 1;
    document.getElementById("servico_valor").value = "";
    document.getElementById("servico_comissao").checked = false;

    console.log(servicos);
    renderServicos();
}

function renderServicos(){
    let html = `
        <table class="tabela-pecas">
            <thead>
                <tr>
                    <th>Descrição</th>
                    <th>Qtd</th>
                    <th>Valor</th>
                    <th>Total</th>
                    <th>Comissão</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
    `;

    servicos.forEach((s, i) => {
        let total = s.qtd * s.valor;

        html += `
            <tr>
                <td>${s.nome}</td>
                <td>${s.qtd}</td>
                <td>R$ ${s.valor.toFixed(2)}</td>
                <td>R$ ${total.toFixed(2)}</td>
                <td>${s.comissao ? "✔" : "-"}</td>
                <td>
                    <button type="button" class="btn-acao" onclick="editarServico(${i})">✏️</button>
                    <button type="button" class="btn-acao btn-remove" onclick="removerServico(${i})">🗑️</button>
                </td>
            </tr>
        `;
    });

    html += "</tbody></table>";

    document.getElementById("tabela_servicos").innerHTML = html;
    document.getElementById("servicos_json").value = JSON.stringify(servicos);
}

function removerServico(index){
    servicos.splice(index, 1);
    renderServicos();
}

function editarServico(index){
    let s = servicos[index];

    document.getElementById("servico_nome").value = s.nome;
    document.getElementById("servico_qtd").value = s.qtd;
    document.getElementById("servico_valor").value = s.valor;
    document.getElementById("servico_comissao").checked = s.comissao;

    servicos.splice(index, 1);

    renderServicos();
}

function calcularTotalGeral(){
    let total = 0;

    // 🧩 PEÇAS (novo)
    if (typeof pecas !== "undefined") {
        pecas.forEach(p => {
            total += p.qtd * p.valor;
        });
    }

    if (typeof servicos !== "undefined") {
        servicos.forEach(s => {
            total += s.qtd * s.valor;
        });
    }

    document.getElementById("total_geral").innerText = total.toFixed(2);
}

window.onload = function(){

    // 🔧 PEÇAS (NOVO PADRÃO)
    let dados = JSON.parse('{{ pecas | tojson | safe }}');

    pecas = [];

    dados.forEach(p=>{
        pecas.push({
            nome:p[0],
            valor:parseFloat(p[1]),
            qtd:parseFloat(p[2])
        });
    });

    renderPecas();

    // 🛠 SERVIÇOS (NOVO PADRÃO)
    let dadosServicos = JSON.parse('{{ servicos | tojson | safe }}');

    servicos = [];

    dadosServicos.forEach(s => {
        servicos.push({
            nome: s[0],
            valor: parseFloat(s[1]),
            qtd: parseFloat(s[2]),
            comissao: s[3]
        });
    });

    renderServicos();
    calcularTotalGeral();
}
</script>

</body>
</html>
