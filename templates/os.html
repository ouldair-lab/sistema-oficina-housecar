<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordem de Serviço</title>

<link rel="stylesheet" href="/static/style.css">

<style>
.secao {
    background: #1e3a8a;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 12px;
}

.secao h3 {
    margin-bottom: 10px;
}

.secao-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.btn-add {
    background: #06d6a0;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.btn-add:hover {
    background: #05b386;
}

.botoes {
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.btn-principal {
    background:#16a34a;
    color:white;
    padding:10px;
    border:none;
    border-radius:8px;
}

.btn-secundario {
    background:#2563eb;
    color:white;
    padding:10px;
    border-radius:8px;
    text-decoration:none;
}
</style>

</head>

<body>

{% include "_header.html" %}

<form method="POST" action="/atualizar_os">

<input type="hidden" name="ordem_id" value="{{ id }}">

<div class="secao">
    <h3>Dados do Cliente</h3>

    <div class="campo">
        <label>Nome do Cliente:</label>
        <input type="text" name="cliente" value="{{ cliente }}">
    </div>

    <div class="campo">
        <label>Veículo:</label>
        <input type="text" name="veiculo" value="{{ veiculo }}">
    </div>

    <div class="campo">
        <label>Placa:</label>
        <input type="text" name="placa" value="{{ placa }}">
    </div>
</div>

{% if tipo == 'os' %}

<div class="secao">
    <h3>Datas e Responsável</h3>

    <div class="campo">
        <label>Data de Entrada:</label>
        <input type="date" name="data_entrada" value="{{ data_entrada }}">
    </div>

    <div class="campo">
        <label>Data de Saída:</label>
        <input type="date" name="data_saida" value="{{ data_saida }}">
    </div>

    <div class="campo">
        <label>Mecânico:</label>
        <select name="mecanico">
            <option value="">Selecione</option>

            {% for m in mecanicos %}
                <option value="{{ m[1] }}" {% if mecanico == m[1] %}selected{% endif %}>
                    {{ m[1] }}
                </option>
            {% endfor %}
        </select>
    </div>
</div>

{% else %}

<div class="secao">
    <h3>Orçamento</h3>

    <div class="campo">
        <label>Data do Orçamento:</label>
        <input type="text" value="{{ data_entrada }}" readonly>
    </div>

    <div class="campo">
        <label>Validade:</label>
        <input type="text" value="5 dias" readonly>
    </div>

    <div class="campo">
        <label>Mecânico:</label>
        <select name="mecanico">
            <option value="">Selecione</option>

            {% for m in mecanicos %}
                <option value="{{ m[1] }}" {% if mecanico == m[1] %}selected{% endif %}>
                    {{ m[1] }}
                </option>
            {% endfor %}
        </select>
    </div>
</div>

{% endif %}

<div class="secao">
    <h3>Diagnóstico</h3>

    <div class="campo">
        <label>Problema:</label>
        <textarea name="problema">{{ problema }}</textarea>
    </div>

    <div class="campo">
        <label>Solução:</label>
        <textarea name="diagnostico">{{ diagnostico }}</textarea>
    </div>
</div>

<h3>🔧 Peças</h3>

<button type="button" class="btn-novo" onclick="addPeca()">+ Peça</button>

<div id="lista_pecas"></div>

<h3>🛠 Serviços</h3>

<button type="button" class="btn-novo" onclick="addServico()">+ Serviço</button>

<div id="lista_servicos"></div>

<h3>TOTAL: R$ <span id="total_geral">0.00</span></h3>

<div class="secao">
    <div class="campo">
        <label>Status:</label>
        <select name="status">
            <option value="EM ANDAMENTO" {% if status == "EM ANDAMENTO" %}selected{% endif %}>EM ANDAMENTO</option>
            <option value="AGUARDANDO PEÇAS" {% if status == "AGUARDANDO PEÇAS" %}selected{% endif %}>AGUARDANDO PEÇAS</option>
            <option value="PENDENTE" {% if status == "PENDENTE" %}selected{% endif %}>PENDENTE</option>
            <option value="FINALIZADA" {% if status == "FINALIZADA" %}selected{% endif %}>FINALIZADA</option>
        </select>
    </div>
</div>

<div class="botoes">
    <button type="submit" class="btn-principal">💾 Atualizar OS</button>

    {% if id and id != 0 %}
    <a href="/gerar_nota/{{ id }}" target="_blank" class="btn-secundario">
        📄 Gerar / Abrir Nota
    </a>
    <a href="/cancelar_os/{{ id }}" 
        onclick="return confirm('Deseja realmente cancelar esta OS?')"
        style="background:#dc2626; color:white; padding:10px; border-radius:8px; text-decoration:none;">
        ❌ Cancelar OS
    </a>
    {% endif %}
</div>

</form>

<script>
let indexServico = 0;

function addPeca(){
    let div = document.createElement("div");
    div.classList.add("linha-item");

    div.innerHTML = `
        <div class="campo-full">
            <label>Descrição</label>
            <input name="peca_nome">
        </div>

        <div class="linha-valores">

            <div class="item-campo">
                <label>Qtde</label>
                <input type="number" name="peca_qtd" value="1" oninput="calcularLinha(this)">
            </div>

            <div class="item-campo">
                <label>Valor Unit.</label>
                <input type="number" step="0.01" name="peca_valor" oninput="calcularLinha(this)">
            </div>

            <div class="item-campo">
                <label>Total</label>
                <input type="text" readonly>
            </div>

            <button type="button" class="btn-remove" onclick="this.closest('.linha-item').remove(); calcularTotalGeral();">
            🗑 Excluir
            </button>

        </div>
    `;

    document.getElementById("lista_pecas").appendChild(div);
}

function addServico(){
    let i = indexServico++;

    let div = document.createElement("div");
    div.classList.add("linha-item");

    div.innerHTML = `
        <div class="campo-full">
            <label>Descrição</label>
            <input name="servico_nome_${i}">
        </div>

        <div class="linha-valores">

            <div class="item-campo">
                <label>Qtde</label>
                <input type="number" name="servico_qtd_${i}" value="1" oninput="calcularLinha(this)">
            </div>

            <div class="item-campo">
                <label>Valor Unit.</label>
                <input type="number" step="0.01" name="servico_valor_${i}" oninput="calcularLinha(this)">
            </div>

            <div class="item-campo">
                <label>Total</label>
                <input type="text" readonly>
            </div>

            <div class="item-campo">
                <label>Comissão</label>
                <input type="checkbox" name="servico_comissao_${i}">
            </div>

            <button type="button" class="btn-remove" onclick="this.closest('.linha-item').remove(); calcularTotalGeral();">
            🗑 Excluir
            </button>

        </div>
    `;

    document.getElementById("lista_servicos").appendChild(div);
}

function calcularLinha(el){
    let linha = el.closest('.linha-item');

    let qtd = linha.querySelector('input[name*="qtd"]');
    let valor = linha.querySelector('input[name*="valor"]');
    let total = linha.querySelector('input[readonly]');

    let q = parseFloat(qtd.value || 0);
    let v = parseFloat(valor.value || 0);

    let resultado = q * v;

    total.value = resultado.toFixed(2);

    calcularTotalGeral();
}

function calcularTotalGeral(){
    let total = 0;

    document.querySelectorAll('#lista_pecas .linha-item').forEach(linha => {
        let t = linha.querySelector('input[readonly]').value;
        total += parseFloat(t || 0);
    });

    document.querySelectorAll('#lista_servicos .linha-item').forEach(linha => {
        let t = linha.querySelector('input[readonly]').value;
        total += parseFloat(t || 0);
    });

    document.getElementById("total_geral").innerText = total.toFixed(2);
}

window.onload = function(){

    let pecas = JSON.parse('{{ pecas | tojson | safe }}');
    pecas.forEach(p => {
        addPeca();
        let ultima = document.querySelector('#lista_pecas .linha-item:last-child');

        ultima.querySelector('[name="peca_nome"]').value = p[0];
        ultima.querySelector('[name="peca_valor"]').value = p[1];
        ultima.querySelector('[name="peca_qtd"]').value = p[2];

        calcularLinha(ultima);
    });

    let servicos = JSON.parse('{{ servicos | tojson | safe }}');
    servicos.forEach(s => {
        addServico();
        let ultima = document.querySelector('#lista_servicos .linha-item:last-child');

        ultima.querySelector('[name^="servico_nome"]').value = s[0];
        ultima.querySelector('[name^="servico_valor"]').value = s[1];
        ultima.querySelector('[name^="servico_qtd"]').value = s[2];
        ultima.querySelector('[type="checkbox"]').checked = s[3];

        calcularLinha(ultima);
    });

    // 🔥 CORREÇÕES IMPORTANTES
    indexServico = servicos.length;
    calcularTotalGeral();
}
</script>

</body>
</html>
