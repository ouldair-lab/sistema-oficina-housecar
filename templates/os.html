<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordem de Serviço</title>

<link rel="stylesheet" href="/static/style.css">

<style>
.secao {
    background: #1e3a8a;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 12px;
}

.secao h3 {
    margin-bottom: 10px;
}

.secao-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.btn-add {
    background: #06d6a0;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.btn-add:hover {
    background: #05b386;
}

.botoes {
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.btn-principal {
    background:#16a34a;
    color:white;
    padding:10px;
    border:none;
    border-radius:8px;
}

.btn-secundario {
    background:#2563eb;
    color:white;
    padding:10px;
    border-radius:8px;
    text-decoration:none;
}
</style>

</head>

<body>

<!-- HEADER PADRÃO -->
{% include "_header.html" %}

<form method="POST" action="/atualizar_os">

<input type="hidden" name="ordem_id" value="{{ id }}">

<div class="secao">
    <h3>Dados do Cliente</h3>

    <div class="campo">
        <label>Nome do Cliente:</label>
        <input type="text" name="cliente" value="{{ cliente }}">
    </div>

    <div class="campo">
        <label>Veículo:</label>
        <input type="text" name="veiculo" value="{{ veiculo }}">
    </div>

    <div class="campo">
        <label>Placa:</label>
        <input type="text" name="placa" value="{{ placa }}">
    </div>
</div>

<div class="secao">
    <h3>Datas e Responsável</h3>

    <div class="campo">
        <label>Data de Entrada:</label>
        <input type="date" name="data_entrada" value="{{ data_entrada }}">
    </div>

    <div class="campo">
        <label>Data de Saída:</label>
        <input type="date" name="data_saida" value="{{ data_saida }}">
    </div>

    <div class="campo">
        <label>Mecânico:</label>
        <select name="mecanico">
            <option value="Victor" {% if mecanico == "Victor" %}selected{% endif %}>Victor</option>
            <option value="Erick" {% if mecanico == "Erick" %}selected{% endif %}>Erick</option>
            <option value="Max" {% if mecanico == "Max" %}selected{% endif %}>Max</option>
        </select>
    </div>
</div>

<div class="secao">
    <h3>Diagnóstico</h3>

    <div class="campo">
        <label>Problema:</label>
        <textarea name="problema">{{ problema }}</textarea>
    </div>

    <div class="campo">
        <label>Solução:</label>
        <textarea name="diagnostico">{{ diagnostico }}</textarea>
    </div>
</div>

<div class="secao">
    <div class="secao-topo">
        <h3>Peças</h3>
        <button type="button" class="btn-add" onclick="addPeca()">+ Peça</button>
    </div>

    <div id="pecas"></div>
</div>

<div class="secao">
    <div class="secao-topo">
        <h3>Serviços</h3>
        <button type="button" class="btn-add" onclick="addServico()">+ Serviço</button>
    </div>

    <div id="servicos"></div>
</div>

<h2 id="total_geral">TOTAL: R$ {{ total }}</h2>

<div class="secao">
    <div class="campo">
        <label>Status:</label>
        <select name="status">
            <option value="EM ANDAMENTO" {% if status == "EM ANDAMENTO" %}selected{% endif %}>EM ANDAMENTO</option>
            <option value="AGUARDANDO PEÇAS" {% if status == "AGUARDANDO PEÇAS" %}selected{% endif %}>AGUARDANDO PEÇAS</option>
            <option value="PENDENTE" {% if status == "PENDENTE" %}selected{% endif %}>PENDENTE</option>
            <option value="FINALIZADA" {% if status == "FINALIZADA" %}selected{% endif %}>FINALIZADA</option>
        </select>
    </div>
</div>

<div class="botoes">

    <button type="submit" class="btn-principal">💾 Atualizar OS</button>

    {% if status == "FINALIZADA" %}
    <a href="/gerar_nota/{{ id }}" class="btn-secundario" target="_blank">📄 Abrir Nota</a>
    {% endif %}

</div>

</form>

<script>
// (TODO seu JS original mantido igual — não mexi)
</script>

<script>
function addPeca(nome="", valor="", qtd=1) {
    let div = document.createElement("div");
    div.classList.add("item");

    div.innerHTML = `
        <div class="linha-item">
            <input type="text" name="peca_nome" value="${nome}" placeholder="Nome da peça">
            <input type="number" name="peca_valor" value="${valor}" step="0.01" oninput="calcular()">
            <input type="number" name="peca_qtd" value="${qtd}" oninput="calcular()">
            <button type="button" onclick="removerItem(this)">❌</button>
        </div>
        <span class="total_item">Total: R$ 0</span>
    `;
    document.getElementById("pecas").appendChild(div);
}

let contadorServico = 0;

function addServico(nome="", valor="", qtd=1, comissao=true) {
    let index = contadorServico++;

    let div = document.createElement("div");
    div.classList.add("item");

    div.innerHTML = `
        <div class="linha-item">
            <input type="text" name="servico_nome_${index}" value="${nome}">
            <input type="number" name="servico_valor_${index}" value="${valor}" step="0.01" oninput="calcular()">
            <input type="number" name="servico_qtd_${index}" value="${qtd}" oninput="calcular()">
            <label>
                <input type="checkbox" name="servico_comissao_${index}" ${comissao ? "checked" : ""}>
                Comissão
            </label>
            <button type="button" onclick="removerItem(this)">❌</button>
        </div>
        <span class="valor_comissao">Comissão: R$ 0,00</span>
        <span class="total_item">Total: R$ 0</span>
    `;
    document.getElementById("servicos").appendChild(div);
}

function calcular() {
    let totalGeral = 0;

    document.querySelectorAll("#pecas .item").forEach(item => {
        let valor = parseFloat(item.querySelector('[name="peca_valor"]').value) || 0;
        let qtd = parseInt(item.querySelector('[name="peca_qtd"]').value) || 0;
        let total = valor * qtd;

        item.querySelector(".total_item").innerText =
            "Total: R$ " + total.toFixed(2).replace(".", ",");

        totalGeral += total;
    });

    document.querySelectorAll("#servicos .item").forEach(item => {
        let valor = parseFloat(item.querySelector('[name^="servico_valor_"]').value) || 0;
        let qtd = parseInt(item.querySelector('[name^="servico_qtd_"]').value) || 0;
        let check = item.querySelector('input[type="checkbox"]');

        let total = valor * qtd;

        item.querySelector(".total_item").innerText =
            "Total: R$ " + total.toFixed(2).replace(".", ",");

        let comissao = check.checked ? (total <= 50 ? total * 0.7 : total * 0.4) : 0;

        item.querySelector(".valor_comissao").innerText =
            "Comissão: R$ " + comissao.toFixed(2).replace(".", ",");

        totalGeral += total;
    });

    document.getElementById("total_geral").innerText =
        "TOTAL: R$ " + totalGeral.toFixed(2).replace(".", ",");
}

function removerItem(btn) {
    btn.parentElement.remove();
    calcular();
}

window.onload = function() {
    let pecas = JSON.parse('{{ pecas | tojson | safe }}');
    pecas.forEach(p => addPeca(p[0], p[1], p[2]));

    let servicos = JSON.parse('{{ servicos | tojson | safe }}');
    servicos.forEach(s => addServico(s[0], s[1], s[2], s[3]));

    calcular();
};
</script>

</body>
</html>
