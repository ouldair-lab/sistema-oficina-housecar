<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - House Car</title>

<link rel="stylesheet" href="/static/style.css">

<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CARD LOGIN */
.login-box {
    background: #1e3a8a;
    padding: 25px;
    border-radius: 12px;
    width: 100%;
    max-width: 350px;
    text-align: center;
}

/* LOGO */
.logo {
    width: 200px;
    margin-bottom: 22px;
}

/* INPUTS */
input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

/* BOTÃO */
button {
    width: 100%;
    padding: 12px;
    background: #16a34a;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
}

/* MOBILE EXTRA */
@media (max-width: 480px) {
    .login-box {
        margin: 20px;
        padding: 20px;
    }

    .logo {
        width: 210px;
    }
}
</style>

</head>

<body>

<div class="login-box">

    <img src="/static/logo_housecar.png" class="logo">

    <h2>🔐 Acesso ao Sistema</h2>

    <form method="POST">

        <input type="text" name="usuario" placeholder="Usuário" required>

        <input type="password" name="senha" placeholder="Senha" required>

        <button type="submit">Entrar</button>

    </form>

</div>

</body>
</html>
