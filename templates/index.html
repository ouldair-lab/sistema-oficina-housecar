<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Car</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            margin-top: 10px;
        }

        .btn-menu {
            background: #1b263b;
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            text-decoration: none;
            color: white;
            text-align: center;
            display: block;
        }

        .btn-menu:hover {
            background: #415a77;
        }

        .card-financeiro {
            background: #0f2f6b;
            padding: 15px;
            border-radius: 12px;
            margin: 20px;
        }

        .saldo {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #22c55e;
        }

        .linha-financeira {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .titulo-secao {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<!-- HEADER PADRÃO -->
{% include "_header.html" %}

<div class="titulo-secao">📊 Painel da Oficina</div>

<div class="container">

    <a href="/orcamento" class="btn-menu">📄 Orçamento</a>

    <a href="/os_lista" class="btn-menu">📋 Ordens de Serviço</a>

    <a href="/receitas" class="btn-menu">💰 Receitas</a>

    <a href="/despesas" class="btn-menu">💸 Despesas</a>

    <a href="/clientes" class="btn-menu">👤 Clientes</a>

    <a href="/estoque" class="btn-menu">📦 Estoque</a>

    <a href="/relatorios" class="btn-menu">📊 Relatórios</a>

</div>

<!-- CARD FINANCEIRO -->
<div class="card-financeiro">

    <div class="saldo">
        💰 Saldo: R$ {{ "%.2f"|format(saldo) }}
    </div>

    <div class="linha-financeira">
        <span>📈 Receitas</span>
        <span>R$ {{ "%.2f"|format(receitas) }}</span>
    </div>

    <div class="linha-financeira">
        <span>📉 Despesas</span>
        <span>R$ {{ "%.2f"|format(despesas) }}</span>
    </div>

</div>

</body>
</html>
