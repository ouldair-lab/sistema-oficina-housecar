<!DOCTYPE html>
<html lang="pt-br">
<head>

<title>Notas Geradas</title>

<link rel="stylesheet" href="/static/style.css">

<style>
.lista {
    margin-top: 20px;
}

.item {
    background: #1e3a8a;
    padding: 12px;
    border-radius: 10px;

}

a {

    text-decoration: none;
}

</head>

<body>

<h2>📁 Notas Geradas</h2>

<div class="lista">

{% for arq in arquivos %}

    📄 {{ arq }}
    <br>
    <a href="/abrir_nota/{{ arq }}" target="_blank">Abrir</a>
</div>
{% endfor %}

</div>

</body>
</html>
