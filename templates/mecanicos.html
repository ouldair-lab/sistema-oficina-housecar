<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecânicos</title>
<link rel="stylesheet" href="/static/style.css">

<style>
.topo-padrao {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 15px 0;
}

.btn-add {
    background: #06d6a0;
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: bold;
    border: none;
}

.tabela-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    color: black;
    border-radius: 8px;
    overflow: hidden;
}

th, td {
    padding: 10px;
    text-align: center;
}

th {
    background: #1e3a8a;
    color: white;
}

tr:nth-child(even) {
    background: #f2f2f2;
}

.btn-acao {
    padding: 6px 10px;
    border-radius: 6px;
    color: white;
    text-decoration: none;
}

.btn-edit {
    background: #2563eb;
}

.btn-del {
    background: #dc2626;
}

.modal {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    color: black;
    padding: 15px;
    border-radius: 15px 15px 0 0;
}
</style>

</head>

<body>

{% include "_header.html" %}

<div class="topo-padrao">
    <h3>🔧 Mecânicos</h3>
    <button class="btn-add" onclick="abrirModal()">+ Mecânico</button>
</div>

<div class="tabela-container">
<table>
<tr>
    <th>Nome</th>
    <th>Comissão Padrão</th>
    <th>Comissão Baixa</th>
    <th>Limite</th>
    <th>Ações</th>
</tr>

{% for m in mecanicos %}
<tr>
    <td>{{ m[1] }}</td>
    <td>{{ m[2] }}</td>
    <td>{{ m[3] }}</td>
    <td>R$ {{ m[4] }}</td>

    <td>
        <button class="btn-acao btn-edit"
            data-id="{{ m[0] }}"
            data-nome="{{ m[1] }}"
            data-padrao="{{ m[2] }}"
            data-baixa="{{ m[3] }}"
            data-limite="{{ m[4] }}"
            onclick="abrirEdit(this)">
            ✏️
        </button>

        <a href="/excluir_mecanico/{{ m[0] }}"
           class="btn-acao btn-del"
           onclick="return confirm('Excluir mecânico?')">
           🗑️
        </a>
    </td>
</tr>
{% endfor %}
</table>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<form method="POST" id="formMecanico">

    <h3 id="tituloModal">Novo Mecânico</h3>

    <input type="hidden" id="edit_id">

    <input name="nome" id="edit_nome" placeholder="Nome" required>
    <input name="comissao_padrao" id="edit_padrao" placeholder="Comissão padrão (ex: 0.4)" required>
    <input name="comissao_baixa" id="edit_baixa" placeholder="Comissão baixa (ex: 0.7)" required>
    <input name="limite_baixa" id="edit_limite" placeholder="Limite (ex: 50)" required>

    <button type="submit">Salvar</button>
    <button type="button" onclick="fecharModal()">Cancelar</button>

</form>
</div>

<script>
function abrirModal(){
    document.getElementById("modal").style.display="block";

    document.getElementById("formMecanico").action = "/mecanicos";
    document.getElementById("tituloModal").innerText = "Novo Mecânico";

    limparCampos();
}

function fecharModal(){
    document.getElementById("modal").style.display="none";
}

function limparCampos(){
    document.getElementById("edit_nome").value = "";
    document.getElementById("edit_padrao").value = "";
    document.getElementById("edit_baixa").value = "";
    document.getElementById("edit_limite").value = "";
}

function abrirEdit(btn){
    document.getElementById("modal").style.display="block";

    let id = btn.dataset.id;

    document.getElementById("formMecanico").action = "/editar_mecanico/" + id;
    document.getElementById("tituloModal").innerText = "Editar Mecânico";

    document.getElementById("edit_nome").value = btn.dataset.nome;
    document.getElementById("edit_padrao").value = btn.dataset.padrao;
    document.getElementById("edit_baixa").value = btn.dataset.baixa;
    document.getElementById("edit_limite").value = btn.dataset.limite;
}
</script>

</body>
</html>
