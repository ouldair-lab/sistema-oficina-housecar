<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecânicos</title>
<link rel="stylesheet" href="/static/style.css">

<style>
.card {
    background: #1e3a8a;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 12px;
}

.topo-padrao {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 15px 0;
}

.btn-novo {
    background: #06d6a0;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    font-weight: bold;
}

.form-editar {
    margin-top: 10px;
    display: none;
}
</style>

</head>

<body>

{% include "_header.html" %}

<div class="topo-padrao">
    <h3>🔧 Mecânicos</h3>
    <button class="btn-novo" onclick="toggleForm()">+ Mecânico</button>
</div>

<!-- FORM NOVO -->
<div id="formMecanico" style="display:none;">
<form method="POST">

    <input name="nome" placeholder="Nome" required>
    <input name="comissao_padrao" placeholder="Comissão padrão (ex: 0.4)" required>
    <input name="comissao_baixa" placeholder="Comissão baixa (ex: 0.7)" required>
    <input name="limite_baixa" placeholder="Limite (ex: 50)" required>

    <button type="submit">Salvar</button>

</form>
</div>

<!-- LISTA -->
{% for m in mecanicos %}
<div class="card">

    <strong>{{ m[1] }}</strong><br>
    Comissão padrão: {{ m[2] }}<br>
    Comissão baixa: {{ m[3] }}<br>
    Limite: R$ {{ m[4] }}

    <br><br>

    <button data-id="{{ m[0] }}" onclick="toggleEditar(this)">✏️ Editar</button>

    <a href="/excluir_mecanico/{{ m[0] }}"
       onclick="return confirm('Excluir mecânico?')"
       style="color:red;">
       🗑 Excluir
    </a>

    <!-- FORM EDITAR -->
    <div id="editar{{ m[0] }}" class="form-editar">

        <form method="POST" action="/editar_mecanico/{{ m[0] }}">

            <input name="nome" value="{{ m[1] }}">
            <input name="comissao_padrao" value="{{ m[2] }}">
            <input name="comissao_baixa" value="{{ m[3] }}">
            <input name="limite_baixa" value="{{ m[4] }}">

            <button type="submit">💾 Salvar</button>

        </form>

    </div>

</div>
{% endfor %}

<script>
function toggleForm(){
    let f = document.getElementById("formMecanico");
    f.style.display = f.style.display === "none" ? "block" : "none";
}

function toggleEditar(btn){
    let id = btn.getAttribute("data-id");
    let f = document.getElementById("editar" + id);
    f.style.display = f.style.display === "none" ? "block" : "none";
}
</script>

</body>
</html>
