<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes</title>
<link rel="stylesheet" href="/static/style.css">

<style>
.card {
    background: #1e3a8a;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 12px;
}

.topo-clientes {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 15px 0;
}

.btn-add {
    background: #06d6a0;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.btn-add:hover {
    background: #05b386;
}

.form-container {
    display: none;
    margin-bottom: 20px;
}
</style>

</head>

<body>

<!-- HEADER PADRÃO -->
{% include "_header.html" %}

<!-- TOPO -->
<div class="topo-clientes">
    <h3>Lista de Clientes</h3>
    <button class="btn-add" onclick="toggleForm()">+ Cliente</button>
</div>

<!-- FORM -->
<div id="formCliente" class="form-container">

<form method="POST">

    <input name="nome" placeholder="Nome" required>

    <input name="telefone" placeholder="Telefone (WhatsApp)" required>

    <input name="documento" placeholder="CPF ou CNPJ">

    <input name="veiculo" placeholder="Veículo">

    <input name="placa" placeholder="Placa">

    <button type="submit">Salvar</button>

</form>

</div>

<!-- LISTA -->
{% for c in clientes %}
<div class="card">

    <div><strong>NOME DO CLIENTE:</strong> {{ c[1] }}</div>

    <div><strong>TELEFONE:</strong> {{ c[2] }}</div>

    <div><strong>CPF/CNPJ:</strong> {{ c[3] or '-' }}</div>

    <div><strong>VEÍCULO:</strong> {{ c[4] or '-' }}</div>

    <div><strong>PLACA:</strong> {{ c[5] or '-' }}</div>

</div>
{% endfor %}

<script>
function toggleForm() {
    let form = document.getElementById("formCliente");
    form.style.display = form.style.display === "none" ? "block" : "none";
}
</script>

</body>
</html>
