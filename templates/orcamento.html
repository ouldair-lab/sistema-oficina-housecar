<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento</title>

<link rel="stylesheet" href="/static/style.css">

<style>
.sugestoes {
    background: white;
    color: black;
    border-radius: 8px;
    margin-top: 5px;
    max-height: 150px;
    overflow-y: auto;
}
.sugestao-item {
    padding: 8px;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
}
.sugestao-item:hover {
    background: #f1f1f1;
}

.secao {
    background: #1e3a8a;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 12px;
}

.secao-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.btn-add {
    background: #06d6a0;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.botoes {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.btn-principal {
    background:#16a34a;
    color:white;
    padding:12px;
    border:none;
    border-radius:8px;
}

.btn-whats {
    background:#25D366;
    color:white;
    padding:12px;
    border:none;
    border-radius:8px;
}
</style>
</head>

<body>

<!-- HEADER PADRÃO -->
{% include "_header.html" %}

<form method="POST">

<div class="secao">
    <h3>Cliente</h3>

    <div class="campo">
        <label>Nome:</label>
        <input type="text" id="cliente" name="cliente">
        <div id="lista_clientes" class="sugestoes"></div>
    </div>

    <div class="campo">
        <label>Telefone:</label>
        <input type="text" id="telefone" name="telefone">
    </div>

    <div class="campo">
        <label>Veículo:</label>
        <input type="text" id="veiculo" name="veiculo">
    </div>

    <div class="campo">
        <label>Placa:</label>
        <input type="text" id="placa" name="placa" required>
    </div>
</div>

<div class="secao">
    <h3>Diagnóstico</h3>

    <div class="campo">
        <label>Problema:</label>
        <textarea name="problema"></textarea>
    </div>

    <div class="campo">
        <label>Solução:</label>
        <textarea name="diagnostico"></textarea>
    </div>

    <div class="campo">
        <label>Mecânico:</label>
        <select name="mecanico">
            <option value="">Selecione</option>

            {% for m in mecanicos %}
                <option value="{{ m[1] }}">{{ m[1] }}</option>
            {% endfor %}

        </select>
    </div>
</div>

<div class="linha-item">

    <input name="peca_nome" placeholder="Descrição">

    <input name="peca_qtd" type="number" placeholder="Qtde" value="1" oninput="calcularLinha(this)">

    <input name="peca_valor" type="number" step="0.01" placeholder="Valor Unitário" oninput="calcularLinha(this)">

    <input type="text" placeholder="Total" readonly>

</div>

<div class="linha-item">

    <input name="servico_nome_0" placeholder="Descrição">

    <input name="servico_qtd_0" type="number" value="1" placeholder="Qtde" oninput="calcularLinha(this)">

    <input name="servico_valor_0" type="number" step="0.01" placeholder="Valor Unitário" oninput="calcularLinha(this)">

    <input type="text" placeholder="Total" readonly>

    <label>
        Comissão
        <input type="checkbox" name="servico_comissao_0">
    </label>

</div>

<h2 id="total_geral">TOTAL: R$ 0,00</h2>

<div class="botoes">
    <button type="submit" class="btn-principal">💾 Salvar Orçamento</button>
    <button type="button" onclick="enviarWhatsApp()" class="btn-whats">📲 Enviar WhatsApp</button>
</div>

</form>

<script>
function calcularLinha(el){
    let linha = el.parentElement;

    let qtd = linha.querySelector('input[name*="qtd"]');
    let valor = linha.querySelector('input[name*="valor"]');
    let total = linha.querySelector('input[placeholder="Total"]');

    let q = parseFloat(qtd.value || 0);
    let v = parseFloat(valor.value || 0);

    total.value = (q * v).toFixed(2);
}
</script>

<script>
// (autocomplete igual)
async function buscarClientes(valor){
    if(valor.length<2){return;}
    let res=await fetch(`/buscar_cliente?q=${valor}`);
    let lista=await res.json();

    let html="";
    lista.forEach(c=>{
        html+=`<div class="sugestao-item" onclick='selecionarCliente(${JSON.stringify(c)})'>
        <strong>${c.nome}</strong><br>${c.veiculo||""} - ${c.placa||""}</div>`;
    });
    lista_clientes.innerHTML=html;
}

function selecionarCliente(c){
    cliente.value=c.nome||"";
    telefone.value=c.telefone||"";
    veiculo.value=c.veiculo||"";
    placa.value=c.placa||"";
    lista_clientes.innerHTML="";
}

cliente.addEventListener("input",e=>buscarClientes(e.target.value));
placa.addEventListener("input",e=>buscarClientes(e.target.value));

function addPeca(nome="",valor="",qtd=1){
    let div=document.createElement("div");
    div.classList.add("item");

    div.innerHTML=`
    <input name="peca_nome" value="${nome}">
    <input name="peca_valor" value="${valor}" type="number" step="0.01" oninput="calcular()">
    <input name="peca_qtd" value="${qtd}" type="number" oninput="calcular()">
    <button type="button" onclick="removerItem(this)">❌</button>
    <span class="total_item"></span>
    `;
    pecas.appendChild(div);
}

let contadorServico=0;

function addServico(nome="",valor="",qtd=1){
    let i=contadorServico++;
    let div=document.createElement("div");
    div.classList.add("item");

    div.innerHTML=`
    <input name="servico_nome_${i}" value="${nome}">
    <input name="servico_valor_${i}" value="${valor}" type="number" step="0.01" oninput="calcular()">
    <input name="servico_qtd_${i}" value="${qtd}" type="number" oninput="calcular()">
    <button type="button" onclick="removerItem(this)">❌</button>
    <span class="total_item"></span>
    `;
    servicos.appendChild(div);
}

function calcular(){
    let total=0;

    document.querySelectorAll("#pecas .item").forEach(i=>{
        let v=parseFloat(i.querySelector('[name="peca_valor"]').value)||0;
        let q=parseInt(i.querySelector('[name="peca_qtd"]').value)||0;
        let t=v*q;
        total+=t;
        i.querySelector(".total_item").innerText="R$ "+t.toFixed(2);
    });

    document.querySelectorAll("#servicos .item").forEach(i=>{
        let v=parseFloat(i.querySelector('[name^="servico_valor"]').value)||0;
        let q=parseInt(i.querySelector('[name^="servico_qtd"]').value)||0;
        let t=v*q;
        total+=t;
        i.querySelector(".total_item").innerText="R$ "+t.toFixed(2);
    });

    total_geral.innerText="TOTAL: R$ "+total.toFixed(2);
}

function removerItem(b){b.parentElement.remove();calcular();}

// 🔥 WHATSAPP COM DOMÍNIO
function enviarWhatsApp(){

    let tel = telefone.value.replace(/\D/g,"");
    if(!tel){ alert("Informe telefone"); return; }

    let msg = `Orçamento House Car\n\n`;
    msg += `Cliente: ${cliente.value}\n`;
    msg += `Veículo: ${veiculo.value} - ${placa.value}\n\n`;

    msg += `${total_geral.innerText}\n\n`;

    msg += `👉 Aprovar:\nhttps://housecaroficinamecanica.com.br/aprovar_orcamento/ID_AQUI`;

    let url = `https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`;
    window.open(url,"_blank");
}
</script>

</body>
</html>
