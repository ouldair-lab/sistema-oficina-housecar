<body>

<!-- HEADER PADRÃO -->
{% include "_header.html" %}

<form method="POST">

<div class="secao">
    <h3>Cliente</h3>

    <div class="item-campo">
        <label>Nome:</label>
        <input type="text" id="cliente" name="cliente">
        <div id="lista_clientes" class="sugestoes"></div>
    </div>

    <div class="item-campo">
        <label>Telefone:</label>
        <input type="text" id="telefone" name="telefone">
    </div>

    <div class="item-campo">
        <label>Veículo:</label>
        <input type="text" id="veiculo" name="veiculo">
    </div>

    <div class="item-campo">
        <label>Placa:</label>
        <input type="text" id="placa" name="placa" required>
    </div>
</div>

<div class="secao">
    <h3>Diagnóstico</h3>

    <div class="item-campo">
        <label>Problema:</label>
        <textarea name="problema"></textarea>
    </div>

    <div class="item-campo">
        <label>Solução:</label>
        <textarea name="diagnostico"></textarea>
    </div>

    <div class="item-campo">
        <label>Mecânico:</label>
        <select name="mecanico">
            <option value="">Selecione</option>

            {% for m in mecanicos %}
                <option value="{{ m[1] }}">{{ m[1] }}</option>
            {% endfor %}

        </select>
    </div>
    
</div>

<h3>🔧 Peças</h3>

<button type="button" class="btn-novo" onclick="addPeca()">+ Peça</button>

<div id="lista_pecas"></div>

<h3>🛠 Serviços</h3>

<button type="button" class="btn-novo" onclick="addServico()">+ Serviço</button>

<div id="lista_servicos"></div>

<h3>TOTAL: R$ <span id="total_geral">0.00</span></h3>

<div class="botoes">
    <button class="btn">💾 Salvar Orçamento</button>
    <button class="btn-zap">📲 Enviar WhatsApp</button>
</div>

</form>

<script>
let indexServico = 0;

function addPeca(){
    let div = document.createElement("div");
    div.classList.add("linha-item");

    div.innerHTML = `
        <div class="campo-full">
            <label>Descrição</label>
            <input name="peca_nome">
        </div>

        <div class="linha-valores">

            <div class="item-campo">
                <label>Qtde</label>
                <input type="number" name="peca_qtd" value="1" oninput="calcularLinha(this)">
            </div>

            <div class="item-campo">
                <label>Valor Unit.</label>
                <input type="number" step="0.01" name="peca_valor" oninput="calcularLinha(this)">
            </div>

            <div class="item-campo">
                <label>Total</label>
                <input type="text" readonly>
            </div>

            <button type="button" class="btn-remove" onclick="this.closest('.linha-item').remove()">❌</button>

        </div>
    `;

    document.getElementById("lista_pecas").appendChild(div);
}

function addServico(){
    let i = indexServico++;

    let div = document.createElement("div");
    div.classList.add("linha-item");

    div.innerHTML = `
        <div class="campo-full">
            <label>Descrição</label>
            <input name="servico_nome_${i}">
        </div>

        <div class="linha-valores">

            <div class="item-campo">
                <label>Qtde</label>
                <input type="number" name="servico_qtd_${i}" value="1" oninput="calcularLinha(this)">
            </div>

            <div class="item-campo">
                <label>Valor Unit.</label>
                <input type="number" step="0.01" name="servico_valor_${i}" oninput="calcularLinha(this)">
            </div>

            <div class="item-campo">
                <label>Total</label>
                <input type="text" readonly>
            </div>

            <div class="item-campo">
                <label>Comissão</label>
                <input type="checkbox" name="servico_comissao_${i}">
            </div>

            <button type="button" class="btn-remove" onclick="this.closest('.linha-item').remove()">❌</button>

        </div>
    `;

    document.getElementById("lista_servicos").appendChild(div);
}

function calcularLinha(el){
    let linha = el.closest('.linha-item');

    let qtd = linha.querySelector('input[name*="qtd"]');
    let valor = linha.querySelector('input[name*="valor"]');
    let total = linha.querySelector('input[readonly]');

    let q = parseFloat(qtd.value || 0);
    let v = parseFloat(valor.value || 0);

    let resultado = q * v;

    total.value = resultado.toFixed(2);

    calcularTotalGeral();
}

function calcularTotalGeral(){
    let total = 0;

    document.querySelectorAll('.linha-item input[readonly]').forEach(el => {
        total += parseFloat(el.value || 0);
    });

    document.getElementById("total_geral").innerText = total.toFixed(2);
}
</script>

<script>
// (autocomplete igual)
async function buscarClientes(valor){
    if(valor.length<2){return;}
    let res=await fetch(`/buscar_cliente?q=${valor}`);
    let lista=await res.json();

    let html="";
    lista.forEach(c=>{
        html+=`<div class="sugestao-item" onclick='selecionarCliente(${JSON.stringify(c)})'>
        <strong>${c.nome}</strong><br>${c.veiculo||""} - ${c.placa||""}</div>`;
    });
    lista_clientes.innerHTML=html;
}

function selecionarCliente(c){
    cliente.value=c.nome||"";
    telefone.value=c.telefone||"";
    veiculo.value=c.veiculo||"";
    placa.value=c.placa||"";
    lista_clientes.innerHTML="";
}

cliente.addEventListener("input",e=>buscarClientes(e.target.value));
placa.addEventListener("input",e=>buscarClientes(e.target.value));

// 🔥 WHATSAPP COM DOMÍNIO
function enviarWhatsApp(){

    let tel = telefone.value.replace(/\D/g,"");
    if(!tel){ alert("Informe telefone"); return; }

    let msg = `Orçamento House Car\n\n`;
    msg += `Cliente: ${cliente.value}\n`;
    msg += `Veículo: ${veiculo.value} - ${placa.value}\n\n`;

    msg += `${total_geral.innerText}\n\n`;

    msg += `👉 Aprovar:\nhttps://housecaroficinamecanica.com.br/aprovar_orcamento/ID_AQUI`;

    let url = `https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`;
    window.open(url,"_blank");
}
</script>

</body>
