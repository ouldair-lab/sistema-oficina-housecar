<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamento</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<!-- HEADER PADRÃO -->
{% include "_header.html" %}

<form method="POST" action="/orcamento">

<input type="hidden" name="pecas_json" id="pecas_json">
<input type="hidden" name="servicos_json" id="servicos_json">
<input type="hidden" name="id" id="orcamento_id" value="{{ id }}">

<div class="secao">
    <h3>Cliente</h3>

    <div class="item-campo">
        <label>Nome:</label>
        <input type="text" id="cliente" name="cliente" 
                value="{{ ordem[1] if ordem else ''}}">
        <div id="lista_clientes" class="sugestoes"></div>
    </div>

    <div class="item-campo">
        <label>Telefone:</label>
        <input type="text" id="telefone" name="telefone"
                value="{{ ordem[2] if ordem else '' }}">
    </div>

    <div class="item-campo">
        <label>Veículo:</label>
        <input type="text" id="veiculo" name="veiculo"
                value="{{ ordem[3] if ordem else '' }}">
    </div>

    <div class="item-campo">
        <label>Placa:</label>
        <input type="text" id="placa" name="placa"
                value="{{ ordem[4] if ordem else '' }}">
    </div>
</div>

<div class="secao">
    <h3>Diagnóstico</h3>

    <div class="item-campo">
        <label>Problema:</label>
        <textarea name="problema">{{ ordem[5] if ordem else '' }}</textarea>
    </div>

    <div class="item-campo">
        <label>Solução:</label>
        <textarea name="diagnostico">{{ ordem[6] if ordem else '' }}</textarea>
    </div>

    <div class="item-campo">
        <label>Mecânico:</label>
        <select name="mecanico">
            <option value="">Selecione</option>

            {% for m in mecanicos %}
                <option value="{{ m[0] }}"
                    {% if ordem and ordem[10] == m[0] %}selected{% endif %}>
                    {{ m[0] }}
                </option>
            {% endfor %}
        </select>
    </div>
    
</div>

<h3>🔧 Peças</h3>

<div id="tabela_pecas"></div>

<div class="secao">
    <input type="text" id="peca_nome" placeholder="Descrição">

    <input type="number" id="peca_qtd" value="1">

    <input type="number" id="peca_valor" step="0.01" placeholder="Valor">

    <button type="button" onclick="adicionarPeca()" class="btn-principal">
        + Adicionar Peça
    </button>
</div>

<h3>🛠 Serviços</h3>

<div id="tabela_servicos"></div>

<div class="secao">
    <input type="text" id="servico_nome" placeholder="Descrição">

    <input type="number" id="servico_qtd" value="1">

    <input type="number" id="servico_valor" step="0.01" placeholder="Valor">

    <label style="display:block; margin-top:5px;">
        <input type="checkbox" id="servico_comissao">
        Comissão
    </label>

    <button type="button" onclick="adicionarServico()" class="btn-principal">
        + Adicionar Serviço
    </button>
</div>

<h3>TOTAL: R$ <span id="total_geral">0.00</span></h3>

<div class="botoes">
    <button type="submit" class="btn">
        💾 Salvar Orçamento
    </button>

    <button type="button" class="btn-zap" onclick="enviarWhatsApp()">
        📲 Enviar WhatsApp
    </button>

    {% if id and id != 0 %}
    <button type="button" class="btn"
            onclick="window.open('/gerar_orcamento/{{ id }}', '_blank')">
        🖨 Imprimir Orçamento
    </button>
    {% endif %}
</div>

</form>

<script>
let pecas = [];
function adicionarPeca(){
    let nome = document.getElementById("peca_nome").value;
    let qtd = parseFloat(document.getElementById("peca_qtd").value || 1);
    let valor = parseFloat(document.getElementById("peca_valor").value || 0);

    if(!nome){
        alert("Digite a peça");
        return;
    }

    pecas.push({nome, qtd, valor});

    document.getElementById("peca_nome").value = "";
    document.getElementById("peca_qtd").value = 1;
    document.getElementById("peca_valor").value = "";

    renderPecas();
}

function removerPeca(index){
    pecas.splice(index, 1);
    renderPecas();
}

function editarPeca(index){
    let p = pecas[index];

    document.getElementById("peca_nome").value = p.nome;
    document.getElementById("peca_qtd").value = p.qtd;
    document.getElementById("peca_valor").value = p.valor;

    pecas.splice(index, 1);

    renderPecas();
}

function renderPecas(){
    let html = `
        <table class="tabela-pecas">
            <thead>
                <tr>
                    <th>Descrição</th>
                    <th>Qtd</th>
                    <th>Valor</th>
                    <th>Total</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
    `;

    pecas.forEach((p, i) => {
        let total = p.qtd * p.valor;

        html += `
            <tr>
                <td>${p.nome}</td>
                <td>${p.qtd}</td>
                <td>R$ ${p.valor.toFixed(2)}</td>
                <td>R$ ${total.toFixed(2)}</td>
                <td>
                <div style="display:flex; justify-content:center; gap:6px;">
                    <button type="button" class="btn-acao" onclick="editarPeca(${i})">✏️</button>
                    <button type="button" class="btn-remove" onclick="removerPeca(${i})">🗑️</button>
                </div>
            </td>
            </tr>
        `;
    });

    html += "</tbody></table>";

    document.getElementById("tabela_pecas").innerHTML = html;
    document.getElementById("pecas_json").value = JSON.stringify(pecas);

    calcularTotalGeral();
}

let servicos = [];
function adicionarServico(){
    let nome = document.getElementById("servico_nome").value;
    let qtd = parseFloat(document.getElementById("servico_qtd").value || 1);
    let valor = parseFloat(document.getElementById("servico_valor").value || 0);
    let comissao = document.getElementById("servico_comissao").checked;

    if(!nome){
        alert("Digite o serviço");
        return;
    }

    servicos.push({nome, qtd, valor, comissao});

    document.getElementById("servico_nome").value = "";
    document.getElementById("servico_qtd").value = 1;
    document.getElementById("servico_valor").value = "";
    document.getElementById("servico_comissao").checked = false;

    renderServicos();
}

function removerServico(index){
    servicos.splice(index, 1);
    renderServicos();
}

function editarServico(index){
    let s = servicos[index];

    document.getElementById("servico_nome").value = s.nome;
    document.getElementById("servico_qtd").value = s.qtd;
    document.getElementById("servico_valor").value = s.valor;
    document.getElementById("servico_comissao").checked = s.comissao;

    servicos.splice(index, 1);

    renderServicos();
}

function renderServicos(){
    let html = `
        <table class="tabela-pecas">
            <thead>
                <tr>
                    <th>Descrição</th>
                    <th>Qtd</th>
                    <th>Valor</th>
                    <th>Total</th>
                    <th>Comissão</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
    `;

    servicos.forEach((s, i) => {
        let total = s.qtd * s.valor;

        html += `
            <tr>
                <td>${s.nome}</td>
                <td>${s.qtd}</td>
                <td>R$ ${s.valor.toFixed(2)}</td>
                <td>R$ ${total.toFixed(2)}</td>
                <td>${s.comissao ? "✔" : "-"}</td>
                <td>
                    <div style="display:flex; justify-content:center; gap:6px;">
                        <button type="button" class="btn-acao" onclick="editarServico(${i})">✏️</button>
                        <button type="button" class="btn-remove" onclick="removerServico(${i})">🗑️</button>
                    </div>
                </td>
            </tr>
        `;
    });

    html += "</tbody></table>";

    document.getElementById("tabela_servicos").innerHTML = html;
    document.getElementById("servicos_json").value = JSON.stringify(servicos);

    calcularTotalGeral();
}

function calcularTotalGeral(){
    let total = 0;

    // 🧩 PEÇAS
    if (typeof pecas !== "undefined") {
        pecas.forEach(p => {
            total += p.qtd * p.valor;
        });
    }    
    // SERVIÇOS
    if (typeof servicos !== "undefined") {
        servicos.forEach(s => {
            total += s.qtd * s.valor;
        });
    }

    document.getElementById("total_geral").innerText = total.toFixed(2);
}

window.onload = function(){

    let dadosPecas = JSON.parse('{{ pecas | tojson | safe }}');
    pecas = [];

    dadosPecas.forEach(p => {
        pecas.push({
            nome: p[0],
            valor: parseFloat(p[1]),
            qtd: parseFloat(p[2])
        });
    });

    renderPecas();

    let dadosServicos = JSON.parse('{{ servicos | tojson | safe }}');
    servicos = [];

    dadosServicos.forEach(s => {
        servicos.push({
            nome: s[0],
            valor: parseFloat(s[1]),
            qtd: parseFloat(s[2]),
            comissao: s[3]
        });
    });

    renderServicos();

}
</script>

<script>
// (autocomplete igual)
async function buscarClientes(valor){
    if(valor.length<2){return;}
    let res=await fetch(`/buscar_cliente?q=${valor}`);
    let lista=await res.json();

    let html="";
    lista.forEach(c=>{
        html+=`<div class="sugestao-item" onclick='selecionarCliente(${JSON.stringify(c)})'>
        <strong>${c.nome}</strong><br>${c.veiculo||""} - ${c.placa||""}</div>`;
    });
    lista_clientes.innerHTML=html;
}

function selecionarCliente(c){
    cliente.value=c.nome||"";
    telefone.value=c.telefone||"";
    veiculo.value=c.veiculo||"";
    placa.value=c.placa||"";
    lista_clientes.innerHTML="";
}

cliente.addEventListener("input",e=>buscarClientes(e.target.value));
placa.addEventListener("input",e=>buscarClientes(e.target.value));

// 🔥 WHATSAPP COM DOMÍNIO
function enviarWhatsApp(){

    let tel = telefone.value.replace(/\D/g,"");
    if(!tel){ alert("Informe telefone"); return; }

    let id = document.getElementById("orcamento_id").value;

    let msg = `Orçamento House Car\n\n`;
    msg += `Cliente: ${cliente.value}\n`;
    msg += `Veículo: ${veiculo.value} - ${placa.value}\n\n`;

    msg += `Total: R$ ${total_geral.innerText}\n\n`;

    msg += `👉 Aprovar:\nhttps://housecaroficinamecanica.com.br/aprovar_orcamento/${id}`;

    let url = `https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`;
    window.open(url,"_blank");
}

// ==============================
// 🔥 ENTER INTELIGENTE (ORÇAMENTO)
// ==============================

document.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;

    let el = e.target;
    let id = el.id || "";

    // textarea mantém quebra de linha
    if(el.tagName === "TEXTAREA") return;

    // autocomplete não dispara enter
    if(id === "cliente" || id === "placa") return;

    // 🔧 BLOCO PEÇAS
    if(["peca_nome", "peca_qtd", "peca_valor"].includes(id)){
        e.preventDefault();
        adicionarPeca();
        return;
    }

    // 🛠 BLOCO SERVIÇOS
    if(["servico_nome", "servico_qtd", "servico_valor"].includes(id)){
        e.preventDefault();
        adicionarServico();
        return;
    }

    // fora desses blocos, não interfere
});
</script>

</body>
</html>
