<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Editar Usuário</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

{% include "_header.html" %}

<h2>✏️ Editar Usuário</h2>

<form method="POST">

    <input type="text" name="nome" value="{{ u[1] }}" required>

    <input type="text" name="login" value="{{ u[2] }}" required>

    <select name="tipo">
        <option value="operacional" {% if u[3] == "operacional" %}selected{% endif %}>Operacional</option>
        <option value="admin" {% if u[3] == "admin" %}selected{% endif %}>Admin</option>
    </select>

    <button type="submit">Salvar</button>

</form>

</body>
</html>
