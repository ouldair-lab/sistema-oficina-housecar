<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Financeiro</title>

<link rel="stylesheet" href="/static/style.css">

<style>
.container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding: 20px;
}

.titulo {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
}

.btn-financeiro {
    padding: 18px;
    border-radius: 10px;
    font-size: 18px;
    text-decoration: none;
    color: white;
    text-align: center;
    display: block;
}

.btn-receitas {
    background: #16a34a;
}

.btn-receitas:hover {
    background: #15803d;
}

.btn-despesas {
    background: #dc2626;
}

.btn-despesas:hover {
    background: #b91c1c;
}

.saldo-positivo {
    color: #22c55e;
}

.saldo-negativo {
    color: #ef4444;
}
</style>

</head>

<body>

<!-- HEADER PADRÃO -->
{% include "_header.html" %}

<div class="titulo">💰 Financeiro</div>

<div style="background:#1e3a8a; padding:15px; border-radius:10px; margin-bottom:20px;">

    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">

        <div>
            📈 Receitas: <strong>R$ {{ "%.2f"|format(receitas) }}</strong><br>
            📉 Despesas: <strong>R$ {{ "%.2f"|format(despesas) }}</strong>
        </div>

        <div class="{{ 'saldo-negativo' if saldo < 0 else 'saldo-positivo' }}">
            💰 Saldo: R$ {{ "%.2f"|format(saldo) }}
        </div>

    </div>

</div>

<div class="container">

    <a href="/receitas" class="btn-financeiro btn-receitas">
        📈 Receitas
    </a>

    <a href="/despesas" class="btn-financeiro btn-despesas">
        📉 Despesas
    </a>

    <a href="/pagamentos" class="btn-financeiro btn-despesas">
        💰 Pagamento dos Mecânicos
    </a>

</div>

</body>
</html>
